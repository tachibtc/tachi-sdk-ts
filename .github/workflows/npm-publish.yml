name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check if version is new
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || echo "")
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.check.outputs.publish == 'true'

      - run: npm test
        if: steps.check.outputs.publish == 'true'

      - run: npm run build
        if: steps.check.outputs.publish == 'true'

      - run: npm publish --access public
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        # Use the action rather than the gh CLI: the self-hosted runners don't
        # ship gh, which is what broke the release step (#42).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          generate_release_notes: true
